<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Liti</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    .contact-card {
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .cute-img {
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {

      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }

    }

  </style>

</head>

<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container">

      <a class="navbar-brand fw-bold" href="#">
        🌸 LITI GAME
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="profile.html">
              Profile
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="game.html">
              Game
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="contact.html">
              Contact
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- HEADER -->
  <section class="bg-danger-subtle text-center py-5">

    <div class="container">

      <img
        src="https://cdn-icons-png.flaticon.com/512/4185/4185015.png"
        class="img-fluid cute-img mb-4"
        width="180"
        alt="Bunny"
      >

      <h1 class="fw-bold">
        💌 Contact Liti 🌸
      </h1>

      <p class="lead text-muted">
        Send cute messages and stay connected ✨
      </p>

    </div>

  </section>

  <!-- CONTACT FORM -->
  <section class="container py-5">

    <div class="row justify-content-center">

      <div class="col-md-7">

        <div class="card border-0 shadow-lg p-4 bg-white contact-card">

          <h2 class="text-center fw-bold mb-4">
            🐰 Send Message 🐰
          </h2>

          <form id="contactForm">

            <!-- NAME -->
            <div class="mb-3">

              <label class="form-label fw-semibold">
                🌸 Name
              </label>

              <input
                type="text"
                class="form-control"
                id="name"
                placeholder="Enter your name"
                required
              >

            </div>

            <!-- EMAIL -->
            <div class="mb-3">

              <label class="form-label fw-semibold">
                ✨ Email
              </label>

              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your email"
                required
              >

            </div>

            <!-- MESSAGE -->
            <div class="mb-3">

              <label class="form-label fw-semibold">
                💖 Message
              </label>

              <textarea
                class="form-control"
                rows="5"
                id="message"
                placeholder="Write your cute message here..."
                required
              ></textarea>

            </div>

            <!-- BUTTON -->
            <button
              type="submit"
              class="btn btn-danger w-100 shadow-sm"
            >
              Send Message 💌
            </button>

          </form>

          <!-- RESULT -->
          <h4
            id="result"
            class="text-center mt-4"
          ></h4>

        </div>

      </div>

    </div>

  </section>

  <!-- QUOTE -->
  <section class="container pb-5">

    <div class="card border-0 shadow text-center p-4 bg-white">

      <h3 class="fw-bold mb-3">
        🌸 Cute Quote 🌸
      </h3>

      <p class="text-muted fs-5">
        “Kind messages can make someone's day happier ✨”
      </p>

    </div>

  </section>

  <!-- FOOTER -->
  <footer class="bg-white text-center py-4 shadow-sm">

    <p class="mb-0">
      🌸 Liti Contact Page 🐰
    </p>

  </footer>

  <!-- JAVASCRIPT -->
  <script>

    const form =
      document.getElementById("contactForm");

    const result =
      document.getElementById("result");

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      result.innerHTML =
        "🎉 Message Sent Successfully! 🌸";

      result.className =
        "text-success fw-bold mt-4";

      form.reset();

    });

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
