<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Game</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">MyWebsite</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="profile.html">Profile</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="game.html">Game</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">

    <div class="row justify-content-center">

      <div class="col-md-4">

        <div class="card shadow p-4 text-center">

          <h1 class="mb-4">Guess The Number</h1>

          <p>Tebak angka dari 1 sampai 10</p>

          <input
            type="number"
            id="guess"
            class="form-control mb-3"
            placeholder="Masukkan angka"
          >

          <button class="btn btn-success" onclick="checkGuess()">
            Check
          </button>

          <h4 id="result" class="mt-4"></h4>

        </div>

      </div>

    </div>

  </div>

  <script>
    const secretNumber = Math.floor(Math.random() * 10) + 1;

    function checkGuess() {

      const userGuess =
        parseInt(document.getElementById("guess").value);

      const result =
        document.getElementById("result");

      if (userGuess === secretNumber) {

        result.innerHTML = "🎉 Correct! You Win!";
        result.className = "text-success mt-4";

      } else {

        result.innerHTML = "❌ Wrong! Try Again";
        result.className = "text-danger mt-4";

      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
