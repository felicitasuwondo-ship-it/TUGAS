<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Liti Catch Game</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ANIMATION STYLE -->
  <style>

    #molang {
      transition: all 0.3s ease;
      animation: float 2s infinite ease-in-out;
    }

    #molang:hover {
      transform: scale(1.1) rotate(8deg);
    }

    @keyframes float {

      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }

    }

    .game-card {
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

  </style>

</head>

<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container">

      <a class="navbar-brand fw-bold" href="#">
        🌸 LITI GAME
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="profile.html">
              Profile
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="game.html">
              Game
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">
              Contact
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- HEADER -->
  <section class="bg-warning-subtle text-center py-5">

    <div class="container">

      <img
        src="https://i.pinimg.com/736x/90/8f/2f/908f2f2f2f4d5d76a8f3d5c4b9a6e7d2.jpg"
        class="img-fluid rounded-circle shadow mb-4"
        width="220"
        alt="Molang"
      >

      <h1 class="fw-bold">
        🎮 Catch Liti Game 🐰
      </h1>

      <p class="lead text-muted">
        Klik Molang secepat mungkin untuk mendapatkan score ✨
      </p>

    </div>

  </section>

  <!-- GAME SECTION -->
  <section class="container py-5">

    <div class="row justify-content-center">

      <div class="col-md-8">

        <div class="card border-0 shadow-lg p-4 bg-white text-center game-card">

          <h2 class="fw-bold mb-3">
            🌸 Score:
            <span id="score">0</span>
          </h2>

          <p class="text-muted">
            Klik gambar Molang yang berpindah-pindah!
          </p>

          <!-- GAME AREA -->
          <div
            id="gameArea"
            class="position-relative mx-auto border rounded-4 bg-info-subtle overflow-hidden"
            style="width: 100%; max-width: 700px; height: 450px;"
          >

            <img
              id="molang"
              src="https://cdn-icons-png.flaticon.com/512/616/616408.png"
              width="90"
              class="position-absolute"
              style="cursor: pointer; top: 50px; left: 50px;"
              alt="Molang"
            >

          </div>

          <button
            class="btn btn-warning btn-lg mt-4 shadow-sm"
            onclick="startGame()"
          >
            Start Game 🎮
          </button>

        </div>

      </div>

    </div>

  </section>

  <!-- QUOTE -->
  <section class="container pb-5">

    <div class="card border-0 shadow text-center p-4 bg-white">

      <h3 class="fw-bold mb-3">
        💖 Liti Game Time 💖
      </h3>

      <p class="text-muted fs-5">
        “Play cute games and collect happy moments ✨”
      </p>

    </div>

  </section>

  <!-- FOOTER -->
  <footer class="bg-white text-center py-4 shadow-sm">

    <p class="mb-0">
      🌸 Molang World Game Page 🐰
    </p>

  </footer>

  <!-- JAVASCRIPT -->
  <script>

    let score = 0;

    const molang =
      document.getElementById("molang");

    const gameArea =
      document.getElementById("gameArea");

    const scoreText =
      document.getElementById("score");

    function moveMolang() {

      const maxX =
        gameArea.clientWidth - 100;

      const maxY =
        gameArea.clientHeight - 100;

      const randomX =
        Math.floor(Math.random() * maxX);

      const randomY =
        Math.floor(Math.random() * maxY);

      molang.style.left = randomX + "px";
      molang.style.top = randomY + "px";
    }

    molang.addEventListener("click", function () {

      score++;

      scoreText.innerHTML = score;

      moveMolang();

    });

    function startGame() {

      score = 0;

      scoreText.innerHTML = score;

      moveMolang();

    }

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
