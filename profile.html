<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom, #f8fafc, #eaf2ff);
    }

    .card-custom {
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      border: none;
    }

    .banner {
      border-radius: 16px;
      height: 150px;
      object-fit: cover;
      width: 100%;
    }

    .btn {
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<nav class="navbar bg-white shadow-sm">
  <div class="container">
    <a href="index.html" class="btn btn-outline-secondary btn-sm">Back</a>
    <span class="navbar-brand fw-semibold">Profile</span>
  </div>
</nav>

<div class="container mt-4" style="max-width:600px;">

  <!-- Banner -->
  <img src="https://m.media-amazon.com/images/S/aplus-media-library-service-media/5aa3b7cf-1707-4fa2-b2ca-faaf5d712203.__CR0,0,2021,625_PT0_SX970_V1___.jpg" class="banner mb-3">

  <!-- Profile -->
  <div class="card card-custom p-4 text-center mb-4"
  <!-- FOTO SUPER MARIO  -->
    <img src="https://p4.wallpaperbetter.com/wallpaper/979/43/728/kart-super-mario-princess-peach-bowser-wallpaper-preview.jpg"
         class="rounded-circle mx-auto mb-3"
         width="50">

    <h5 class="mb-1">Felicita Suwondo</h5>
    <p class="text-muted small">XI-D/07</p>
  </div>

  <!-- SUDOKU -->
  <div class="card card-custom p-4 text-center">
    <h6 class="mb-3 text-primary">Mini Sudoku 🧩</h6>
    <p class="small text-muted">Isi angka 1 - 4</p>

    <div class="d-grid gap-2" style="grid-template-columns: repeat(4, 60px); justify-content:center;">
      <input maxlength="1" class="form-control text-center" id="c0">
      <input maxlength="1" class="form-control text-center" id="c1">
      <input maxlength="1" class="form-control text-center" id="c2" value="3">
      <input maxlength="1" class="form-control text-center" id="c3">

      <input maxlength="1" class="form-control text-center" id="c4" value="3">
      <input maxlength="1" class="form-control text-center" id="c5">
      <input maxlength="1" class="form-control text-center" id="c6">
      <input maxlength="1" class="form-control text-center" id="c7">

      <input maxlength="1" class="form-control text-center" id="c8">
      <input maxlength="1" class="form-control text-center" id="c9">
      <input maxlength="1" class="form-control text-center" id="c10">
      <input maxlength="1" class="form-control text-center" id="c11" value="2">

      <input maxlength="1" class="form-control text-center" id="c12">
      <input maxlength="1" class="form-control text-center" id="c13" value="1">
      <input maxlength="1" class="form-control text-center" id="c14">
      <input maxlength="1" class="form-control text-center" id="c15">
    </div>

    <button class="btn btn-primary mt-3" onclick="cekSudoku()">Cek Jawaban</button>

    <p id="hasilSudoku" class="mt-3 small"></p>
  </div>

</div>

<script>
function cekSudoku() {
  let grid = [];

  for (let i = 0; i < 16; i++) {
    let val = document.getElementById("c"+i).value;
    grid.push(val);
  }

  function valid(arr) {
    let s = new Set(arr);
    return s.size === 4 && !arr.includes("");
  }

  let hasil = document.getElementById("hasilSudoku");

  for (let i = 0; i < 4; i++) {
    if (!valid(grid.slice(i*4, i*4+4))) {
      hasil.innerHTML = "❌ Masih salah";
      hasil.style.color = "red";
      return;
    }
  }

  for (let i = 0; i < 4; i++) {
    let col = [grid[i], grid[i+4], grid[i+8], grid[i+12]];
    if (!valid(col)) {
      hasil.innerHTML = "❌ Masih salah";
      hasil.style.color = "red";
      return;
    }
  }

  hasil.innerHTML = "🎉 Benar!";
  hasil.style.color = "green";
}
</script>

</body>
</html>
